<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1A1A2E">
  <meta property="og:title" content="가계쀼 커플 초대">
  <meta property="og:description" content="초대 코드로 함께 가계부를 시작해요">
  <meta name="robots" content="noindex">
  <title>가계쀼 초대</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; background: #1A1A2E; color: #fff; font-family: system-ui, -apple-system, sans-serif; }
    main { width: min(100%, 480px); padding: 28px 20px; border-radius: 16px; background: #2A2A4A; text-align: center; }
    h1 { margin: 0 0 8px; color: #A78BFA; font-size: 28px; }
    .lead, #status { color: #B8B8B8; line-height: 1.6; }
    .code { margin: 20px 0 12px; padding: 16px; border: 1px solid #A78BFA; border-radius: 12px; color: #A78BFA; font-size: 28px; font-weight: 700; letter-spacing: 3px; overflow-wrap: anywhere; }
    button, .open, .store { min-height: 48px; border: 0; border-radius: 12px; font: inherit; font-weight: 700; cursor: pointer; }
    button { width: 100%; background: #A78BFA; color: #14142A; }
    button:disabled { cursor: not-allowed; background: #4B5563; color: #C4C4C4; }
    .open { display: grid; place-items: center; margin-bottom: 10px; background: #A78BFA; color: #14142A; text-decoration: none; }
    #status { margin: 16px 0; font-size: 14px; }
    .stores { display: grid; gap: 10px; margin-top: 18px; }
    .store { display: grid; place-items: center; padding: 0 16px; background: #1A1A2E; color: #fff; text-decoration: none; border: 1px solid #4B5563; }
    .error { color: #FCA5A5; }
  </style>
</head>
<body>
  <main>
    <h1>가계쀼 초대</h1>
    <p class="lead">함께 가계부를 관리할 초대 코드예요.</p>
    <div id="code" class="code" aria-live="polite">확인 중</div>
    <a id="open" class="open" href="#">앱에서 열기</a>
    <button id="copy" type="button">코드 복사</button>
    <p id="status">앱이 설치돼 있으면 '앱에서 열기'를 눌러 주세요. 없으면 아래에서 설치한 뒤 코드를 입력하세요.</p>
    <div class="stores">
      <a id="android" class="store" href="https://play.google.com/store/apps/details?id=com.gagyebbu.app">Android 앱 다운로드</a>
      <a class="store" href="https://apps.apple.com/app/id6793096551">iPhone/iPad 앱 다운로드</a>
    </div>
  </main>
  <script>
    (() => {
      const path = location.pathname.split('/').filter(Boolean);
      const pathCode = path[0] === 'i' && path.length === 2 ? path[1] : '';
      const code = pathCode || new URLSearchParams(location.search).get('c') || '';
      const valid = /^\d{6}$/.test(code);
      const codeEl = document.getElementById('code');
      const open = document.getElementById('open');
      const copy = document.getElementById('copy');
      const status = document.getElementById('status');
      const android = document.getElementById('android');

      codeEl.textContent = valid ? code : '잘못된 초대 링크';
      copy.disabled = !valid;
      if (!valid) {
        status.textContent = '초대 코드를 확인해 주세요.';
        status.classList.add('error');
        open.hidden = true;
        return;
      }

      const playUrl = android.href + '&referrer=invite%3D' + code;
      android.href = playUrl;
      open.href = /Android/i.test(navigator.userAgent)
        ? 'intent://invite/' + code + '#Intent;scheme=com.gagyebbu.app;package=com.gagyebbu.app;S.browser_fallback_url=' + encodeURIComponent(playUrl) + ';end'
        : 'com.gagyebbu.app://invite/' + code;
      copy.addEventListener('click', async () => {
        let copied = false;
        try {
          await navigator.clipboard.writeText(code);
          copied = true;
        } catch (_) {
          const input = document.createElement('textarea');
          input.value = code;
          input.style.position = 'fixed';
          input.style.opacity = '0';
          document.body.appendChild(input);
          input.select();
          try {
            copied = document.execCommand('copy');
          } catch (_) {
            copied = false;
          }
          input.remove();
        }
        copy.textContent = copied ? '복사됐어요' : '길게 눌러 복사하세요';
      });
    })();
  </script>
</body>
</html>
